<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="header-top">
        <div class="header-titles">
          <h1>Mergington High School</h1>
          <h2>Extracurricular Activities</h2>
        </div>
        <div id="auth-section">
          <button
            id="user-icon-btn"
            type="button"
            aria-label="Teacher login"
            title="Teacher login"
            aria-expanded="false"
          >
            👤
          </button>
          <div id="login-panel" class="hidden">
            <form id="login-form">
              <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" required autocomplete="username" />
              </div>
              <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" required autocomplete="current-password" />
              </div>
              <button type="submit">Log in</button>
            </form>
            <div id="logged-in-panel" class="hidden">
              <p>Logged in as <strong id="logged-in-username"></strong></p>
              <button id="logout-btn" type="button">Log out</button>
            </div>
            <div id="login-message" class="hidden" role="alert"></div>
          </div>
        </div>
      </div>
    </header>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container" class="hidden">
        <h3>Sign Up for an Activity</h3>
        <p class="info">Logged in as a teacher. Students viewing without logging in cannot register or unregister anyone.</p>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
